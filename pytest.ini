[pytest]

addopts = -v

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    
    tc_login_001: Verify User Login
    tc_login_002: Verify Login Page Displayed
    tc_login_003: Verify Email Field Visibility
    tc_login_004: Verify Password Field Visibility
    tc_login_005: Verify Login Button Visibility
